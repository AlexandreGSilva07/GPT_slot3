<head>
<meta charset="utf-8">

<title>Citadel — RTS Visual Proof</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f0f0c;color:#f6eed7;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;height:100%}
button{font:inherit}
#game{height:100%;width:100%;position:relative;overflow:hidden;background:linear-gradient(#26261f,#11110e);touch-action:none}
#worldViewport{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;left:50%;top:48%;width:1000px;height:1500px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(.62)}
svg{width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;z-index:30;padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:linear-gradient(180deg,rgba(12,11,8,.97),rgba(12,11,8,.72),transparent);pointer-events:none}
.hudrow{display:flex;align-items:center;gap:7px}
.avatar{width:45px;height:45px;border:2px solid #8c7041;border-radius:5px;background:radial-gradient(circle at 50% 33%,#d2aa83 0 15%,transparent 16%),linear-gradient(145deg,#423629,#151511);box-shadow:0 2px 7px #000 inset,0 2px 6px #000;position:relative;flex:0 0 auto}
.avatar:after{content:"3";position:absolute;right:-5px;bottom:-7px;background:#181713;border:1px solid #8c7041;padding:1px 5px;border-radius:3px;font-weight:900;font-size:12px}
.vip{font-family:Georgia,serif;font-weight:900;font-size:18px;color:#f3cf6a;text-shadow:0 2px 2px #000;border:1px solid #7b6035;background:linear-gradient(#4c3a22,#17130e);padding:9px 10px;transform:skew(-8deg)}
.resources{display:flex;gap:6px;min-width:0;flex:1}
.resource{height:36px;min-width:0;flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid #5f4e35;background:linear-gradient(#312b21dd,#14120ddd);border-radius:6px;box-shadow:inset 0 1px #8b7652;font-weight:800;font-size:13px}
.ico{font-size:18px;filter:drop-shadow(0 2px 1px #000)}
.power{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#234a66,#122738);border:1px solid #7e9eb4;border-radius:0 0 8px 8px;padding:4px 18px 5px;font-family:Georgia,serif;font-weight:900;color:#d8edff;text-shadow:0 2px #000;white-space:nowrap;box-shadow:0 3px 7px #0008}
.power small{opacity:.7;font-size:10px;display:block;text-align:center;letter-spacing:.14em}
.zoomCtl{position:absolute;right:10px;top:86px;z-index:31;display:flex;flex-direction:column;gap:7px}
.zoomCtl button{width:42px;height:42px;border-radius:50%;border:1px solid #8f7954;background:#1a1812dd;color:#f4df9d;font-size:22px;box-shadow:0 3px 8px #0008}
.quest{position:absolute;left:10px;bottom:94px;z-index:29;max-width:72%;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border:1px solid #766344;border-radius:9px;background:linear-gradient(90deg,#1a1711ee,#282218dd);box-shadow:0 5px 14px #0008}
.questIcon{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#bf8a2f,#453019 65%,#17130f 66%);border:1px solid #b99b60;font-size:22px}
.quest b{font-size:13px}
.quest small{display:block;color:#cdbb8c;font-size:10px}
.bottom{position:absolute;z-index:40;left:0;right:0;bottom:0;padding:4px 4px max(4px,env(safe-area-inset-bottom));background:linear-gradient(#262219f4,#0f0e0bf8);border-top:1px solid #887451;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;box-shadow:0 -5px 18px #0009}
.nav{height:74px;border:0;background:transparent;color:#cfc5aa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800}
.nav span{font-size:27px;filter:drop-shadow(0 2px 2px #000)}
.nav.active{color:#ffe6a0;background:linear-gradient(#4b3b23aa,#16130e00)}
.sheet{position:absolute;z-index:50;left:8px;right:8px;bottom:86px;border:1px solid #8c744b;border-radius:14px;background:linear-gradient(180deg,#28231af5,#12110df8);box-shadow:0 12px 32px #000b;transform:translateY(140%);transition:.22s ease;padding:13px}
.sheet.open{transform:translateY(0)}
.sheetHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet h2{font-family:Georgia,serif;margin:0;font-size:18px;color:#f7db87}
.sheet p{margin:3px 0 0;font-size:11px;color:#c0b18e}
.close{width:38px;height:38px;border-radius:50%;background:#17140f;border:1px solid #6f5a3c;color:#e6d5a9}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.actions button{min-height:46px;border-radius:8px;border:1px solid #8f7448;background:linear-gradient(#5e4727,#281d11);color:#ffe9aa;font-size:12px;font-weight:800}
.actions button:disabled{opacity:.42}
.timerline{margin-top:9px;height:7px;background:#0c0b09;border-radius:9px;overflow:hidden;border:1px solid #4b412f}
.timerfill{height:100%;width:0;background:linear-gradient(90deg,#9a6e22,#f1c75e);transition:width .3s linear}
.toast{position:absolute;z-index:70;left:50%;bottom:175px;transform:translate(-50%,15px);opacity:0;background:#16130fe9;border:1px solid #9a7a48;padding:9px 14px;border-radius:20px;font-size:12px;white-space:nowrap;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.floatTag{position:absolute;z-index:25;transform:translate(-50%,-50%);pointer-events:none;font-size:11px;font-weight:900;color:#f5e1a5;text-shadow:0 2px 2px #000;background:#14120dcb;border:1px solid #6b5939;border-radius:10px;padding:3px 7px}
@media(min-width:700px){#world{transform:translate(-50%,-50%) scale(.78)}.sheet{left:50%;right:auto;width:420px;transform:translate(-50%,140%)}.sheet.open{transform:translate(-50%,0)}}
</style>
</head>

const defs={
 keep:{name:'Citadel — Level 2',desc:'Command center. Upgrade to unlock new districts.',cost:1400,action:'Upgrade'},
 fountain:{name:'Royal Fountain',desc:'A civic monument. Collect morale rewards.',cost:0,action:'Inspire'},
 chapel:{name:'Chapel',desc:'Research civic and cultural bonuses.',cost:900,action:'Research'},
 barracks:{name:'Barracks',desc:'Train infantry for city defense.',cost:600,action:'Train'},
 workshop:{name:'Workshop',desc:'Produces construction tools and siege parts.',cost:500,action:'Craft'},
 market:{name:'Market',desc:'Trade resources and collect taxes.',cost:0,action:'Collect'},
 plot:{name:'Build Plot',desc:'Empty construction lot. Build a Sawmill here.',cost:800,action:'Build Sawmill'}
};
let selected='keep',scale=.62,tx=0,ty=0,drag=false,lastX=0,lastY=0,moved=false,timer=null,timerStart=0,timerDur=0,plotBuilt=false;
function fmt(n){return n>=1000?(n/1000).toFixed(n%1000?1:0)+'K':String(n)}
function sync(){for(const k of ['wood','food','gold'])document.querySelector('#'+k).textContent=fmt(resources[k]);document.querySelector('#power').textContent=resources.power.toLocaleString('en-US')}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1400)}
function applyTransform(){world.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${scale})`}
function select(id,el){
 selected=id;const d=defs[id];if(!d)return;
 bname.textContent=d.name;bdesc.textContent=d.desc;primary.textContent=d.action;secondary.textContent=id==='barracks'?'Train x5':id==='market'?'Taxes':'Collect';
 primary.disabled=false;timerfill.style.width='0%';sheet.classList.add('open');
 if(el){
  const box=el.getBBox();selection.setAttribute('cx',box.x+box.width/2);selection.setAttribute('cy',box.y+box.height*.72);selection.setAttribute('rx',Math.max(55,box.width*.45));selection.setAttribute('ry',Math.max(30,box.height*.16));selection.style.opacity='1';
 }
}
document.querySelectorAll('.building').forEach(el=>el.addEventListener('click',e=>{if(moved)return;select(el.dataset.id,el)}));
document.querySelector('#close').addEventListener('click',()=>{sheet.classList.remove('open');selection.style.opacity='0'});
function runTimer(ms,onDone){
 clearInterval(timer);timerDur=ms;timerStart=Date.now();primary.disabled=true;
 timer=setInterval(()=>{let p=Math.min(1,(Date.now()-timerStart)/timerDur);timerfill.style.width=(p*100)+'%';primary.textContent=p<1?Math.ceil((timerDur-(Date.now()-timerStart))/1000)+'s':'Done';if(p>=1){clearInterval(timer);primary.disabled=false;onDone();}},120);
}
primary.addEventListener('click',()=>{
 const d=defs[selected];if(!d)return;
 if(selected==='plot'){
   if(plotBuilt){showToast('Sawmill already built');return}
   if(resources.wood<800){showToast('Not enough wood');return}
   resources.wood-=800;sync();runTimer(6500,()=>{
     plotBuilt=true;defs.plot.name='Sawmill — Level 1';defs.plot.desc='Produces wood for construction.';defs.plot.action='Upgrade';
     const g=document.querySelector('[data-id="plot"]');
     g.innerHTML='<path d="M175 875l90-52 91 52-91 54z" fill="#85745e" stroke="#3a3027" stroke-width="6"/><path d="M198 867l67-59 69 60-69 40z" fill="#79422c" stroke="#3f241c" stroke-width="6"/><path d="M221 873v-43l44-25 44 25v44l-44 26z" fill="#9a876e" stroke="#4c4033" stroke-width="5"/><path d="M282 826l42-54 12 10-40 54z" fill="#4c3927"/><circle cx="324" cy="781" r="15" fill="#4b3928"/>';
     document.querySelector('#questTitle').textContent='Sawmill Complete';document.querySelector('#questSub').textContent='Quest reward +250 wood';
     resources.wood+=250;resources.power+=85;sync();bname.textContent=defs.plot.name;bdesc.textContent=defs.plot.desc;primary.textContent='Upgrade';showToast('Sawmill complete +85 Power');
   }); return;
 }
 const cost=d.cost||0;if(cost&&resources.wood<cost){showToast('Not enough wood');return}
 if(cost)resources.wood-=cost;sync();runTimer(selected==='keep'?5000:3200,()=>{resources.power+=selected==='keep'?120:35;sync();primary.textContent=d.action;showToast(d.action+' complete')});
});
secondary.addEventListener('click',()=>{
 if(selected==='barracks'){if(resources.food<500){showToast('Need 500 food');return}resources.food-=500;resources.power+=25;sync();showToast('5 infantry trained');}
 else {resources.gold+=selected==='market'?180:40;sync();showToast('Resources collected');}
});
document.querySelector('#info').addEventListener('click',()=>showToast('Visual proof — interactive prototype'));
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));showToast(b.dataset.nav+' prototype')}));
document.querySelector('#zin').addEventListener('click',()=>{scale=Math.min(1.1,scale+.08);applyTransform()});
document.querySelector('#zout').addEventListener('click',()=>{scale=Math.max(.42,scale-.08);applyTransform()});
game.addEventListener('pointerdown',e=>{if(e.target.closest('button,.sheet'))return;drag=true;moved=false;lastX=e.clientX;lastY=e.clientY;game.setPointerCapture(e.pointerId)});
game.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;tx+=dx;ty+=dy;lastX=e.clientX;lastY=e.clientY;tx=Math.max(-320,Math.min(320,tx));ty=Math.max(-420,Math.min(420,ty));applyTransform()});
game.addEventListener('pointerup',()=>{drag=false;setTimeout(()=>moved=false,30)});
game.addEventListener('pointercancel',()=>drag=false);
game.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.42,Math.min(1.1,scale+(e.deltaY<0?.05:-.05)));applyTransform()},{passive:false});
sync();applyTransform();
})();
</script>
</body>
</html>
